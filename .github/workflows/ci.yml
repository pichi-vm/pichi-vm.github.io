# Validate every pull request: format, types, and a full build must pass
# before merge. Deploys happen separately (deploy.yml on push to main).
name: CI

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main as a backstop.
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build

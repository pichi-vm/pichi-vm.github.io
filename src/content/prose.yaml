# ─────────────────────────────────────────────────────────────────────────────
# Standalone section prose — the paragraphs that head or caption a section.
# Kept apart from landing.yaml (which holds repeated/structured items) so the
# wording lives in one place; each value is rendered as its own <p> via a named
# slot in the page. Plain text is fine; for emphasis or a line break, write
# inline HTML (e.g. <br>, <strong>) — values are rendered with set:html, so
# HTML is live but Markdown syntax like **bold** is not processed.
# ─────────────────────────────────────────────────────────────────────────────

heroSub: >-
  Keep the container workflow you already know — pull, run, ship one image
  anywhere — but run it as a real virtual machine, with its own kernel and a
  true isolation boundary. Move back to VMs without giving anything up.

comparisonIntro: >-
  Two ways to run software in isolation today — each asks you to give something
  up. pichi is the third: the row-by-row case is below.

howItWorksIntro: >-
  Three steps, and the middle one is a registry you already have.

howItWorksCaption: >-
  Illustrative — the same pull / run flow you'd use for a container image.

comparisonCaveat: >-
  These are real virtual machines — heavier than a container, far lighter than a
  traditional VM.

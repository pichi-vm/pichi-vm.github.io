# ─────────────────────────────────────────────────────────────────────────────
# Standalone section prose — the paragraphs that head or caption a section.
# Kept apart from landing.yaml (which holds repeated/structured items) so the
# wording lives in one place; each value is rendered as its own <p> via a named
# slot in the page. Plain text is fine; for emphasis or a line break, write
# inline HTML (e.g. <br>, <strong>) — values are rendered with set:html, so
# HTML is live but Markdown syntax like **bold** is not processed.
# ─────────────────────────────────────────────────────────────────────────────

heroSub: >-
  An image management platform for building, sharing, distributing, staging and
  running micro-VMs securely and confidentially at scale.

comparisonIntro: >-
  Speed or isolation — until now, you had to choose. Here's how Pichi compares
  to both.

trustIntro: >-
  A Pichi image is built as layers, like a Docker image — and each layer
  cryptographically binds to the one below it, so one trust anchor validates the
  whole stack.

trustCaption: >-
  Shared bases mean common layers are fetched, signed, and scanned once — then
  reused across every image that builds on them.

comparisonCaveat: >-
  These are real virtual machines — heavier than a container, far lighter than a
  traditional VM.

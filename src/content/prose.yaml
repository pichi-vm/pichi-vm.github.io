# ─────────────────────────────────────────────────────────────────────────────
# Standalone section prose — the paragraphs that head or caption a section.
# Kept apart from landing.yaml (which holds repeated/structured items) so the
# wording lives in one place; each value is rendered as its own <p> via a named
# slot in the page. Plain text is fine; for emphasis or a line break, write
# inline HTML (e.g. <br>, <strong>) — values are rendered with set:html, so
# HTML is live but Markdown syntax like **bold** is not processed.
# ─────────────────────────────────────────────────────────────────────────────

heroSub: >-
  One portable image that boots identically on your laptop, in the cloud, or on
  bare metal, with real isolation and a small, fast boot chain with a
  deterministic launch measurement.

problemIntro: >-
  Two ways to run software in isolation today — each asks you to give something
  up.

howItWorksIntro: >-
  Three steps, and the middle one is a registry you already have.

trustIntro: >-
  Images are built as layers, and each layer cryptographically binds to the one
  below it — so one trust anchor validates the whole stack.

trustCaption: >-
  Shared bases mean common layers are fetched, signed, and scanned once — then
  reused across every image that builds on them.

tryItCaption: >-
  Illustrative — the same pull / run flow you'd use for a container image.

# <br> forces the line break; the * is the footnote asterisk that pairs with the
# "on the roadmap*" cell in the comparison table. (Written as a bare * — unlike
# Markdown, set:html needs no backslash escape.)
comparisonCaveat: >-
  These are real virtual machines — heavier than a container, far lighter than a
  traditional VM.<br>*Hardware attestation targets confidential-computing
  platforms (AMD SEV-SNP, with Intel TDX and Arm CCA drafted) and is planned,
  not yet shipping.

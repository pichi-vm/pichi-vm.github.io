heroSub: >-
  Build, distribute, and run Linux virtual machines as OCI images.
  Your workload gets its own kernel, with a command-line workflow you already know.
demoIntro: >-
  Start with Ubuntu. Install Codex. Inspect the image, then let the agent
  discover the machine it is running in.
demoCaption: >-
  Recorded in real time with 2 vCPUs and 512 MiB of guest memory.
  Use fullscreen for a closer look.
imageIntro: >-
  Pichi packages the filesystem, boot payload, and launch configuration together.
  OCI registries carry the artifact; Pichi launches it as a virtual machine.
statusIntro: >-
  Pichi is experimental software in active development.
  The demo shows what works today; the security roadmap goes further.
integrityNote: >-
  Integrity checks verify image blocks against a trusted hash. They do not
  establish who built an image or protect a guest from a malicious host.
footerIntro: >-
  Start with the command reference and build guide. Bring an application,
  try the workflow, and help shape what comes next.

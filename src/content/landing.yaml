# ─────────────────────────────────────────────────────────────────────────────
# Landing page content. Edit the words here — the components render from this.
#
#   • This file holds every REPEATED item: cards, props, steps, table rows,
#     list items, CTA buttons, terminal lines. Edit their text freely.
#   • Standalone paragraphs (section intros, captions) live in prose.yaml,
#     rendered as-is with set:html (use inline HTML like <br> for a break).
# ─────────────────────────────────────────────────────────────────────────────

# Call-to-action buttons, reused in the hero and footer.
# style: "primary" (filled) or "ghost" (outline).
ctas:
  - label: View the source
    href: https://github.com/pichi-vm
    style: primary
  - label: Try It
    href: "#try-it"
    style: ghost

hero:
  logoAlt: pichi-vm mascot — a curled-up armadillo line drawing
  eyebrow: pichi-vm
  # <br> marks the line break in the headline.
  title: The container workflow,<br>for real virtual machines.
  # Compact command preview — the product, above the fold: install, pull, run.
  # The numbered steps below caption these three commands one-to-one.
  commands:
    - apt install pichi
    - pichi pull ghcr.io/acme/postgres-vm:16
    - pichi run postgres-vm:16
  # Numbered caption row under the terminal — one line per command above.
  steps:
    - n: 01 · INSTALL
      heading: " "
      body: Grab the pichi binary. One tool with no host reconfiguration.
    - n: 02 · PULL
      heading: " "
      body: Pull a pichi image from any OCI registry.
    - n: 03 · RUN
      heading: " "
      body: Boot it anywhere as a real VM, designed for a boot measured in milliseconds.
  # Stat strip under the CTAs. Design targets, not measured results — kept
  # honest to match the "early / experimental" badge.
  stats:
    # Three distinct axes: how fast, how you use it, how strong the boundary.
    # - boot target: a design goal, framed as such (matches the "early" badge).
    # - OCI native: pull/push/run over any registry — the container workflow.
    # - Real VM boundary: hardware-isolated (guest runs under the host's
    #   hypervisor — KVM/HVF/WHP — enforcing a CPU-virtualization boundary), not
    #   a host-kernel namespace. "hardware-isolated" = HW virtualization, NOT
    #   SEV/TDX memory encryption (that's the forward-looking CC story on
    #   /security). See pichi ARCHITECTURE.md.
    - { value: ~15 ms, label: boot target }
    - { value: OCI native, label: pull · push · run }
    - { value: Real VM boundary, label: hardware-isolated }

why:
  title: Why Pichi
  # Three pillars, one per axis the hero stats hit (fast / familiar / isolated).
  # Each group: a label headline, a one-line thesis, then its props as a compact
  # stacked list (heading + one-line body). Keep three props per pillar.
  groups:
    - label: Lightweight & fast
      thesis: Boots in milliseconds and adds megabytes — not seconds and gigabytes.
      props:
        - heading: Fast startup
          body: A tiny measured boot chain, not large UEFI firmware — designed to hand off in tens of milliseconds.
        - heading: Low memory overhead
          body: No fat firmware, no emulated legacy hardware — built to add megabytes over the guest, not hundreds.
        - heading: Run anywhere
          body: One image runs on Linux, macOS, and Windows hosts.
    - label: The workflow you know
      thesis: Pull, push, and run over any OCI registry — the container workflow, unchanged.
      props:
        - heading: Container-like workflow
          body: Pull, push, run, and cache over any OCI registry — the workflow you already know.
        - heading: Incremental distribution
          body: Built in layers like a Docker image — push or pull only what changed, and build on anyone else's base.
        - heading: Immutable images
          body: Read-only and content-addressed — you rebuild and redeploy, so what you tested is exactly what runs.
    - label: Real isolation & trust
      thesis: A real hardware VM boundary — your own kernel and memory, not a slice of the host's.
      props:
        - heading: Real isolation
          body: Your own kernel and memory — a true VM boundary, not a shared-kernel namespace.
        - heading: Explicit hardware, by contract
          body: PMI makes the guest's hardware explicit — host and guest negotiate a resource contract at launch, no admin privilege.
        - heading: Confidential computing
          body: A small, measurable trusted base built for attestation — a path to proving hardware, not just trusting it.

# The "Build on trust, extend it forward" steps, shown right after how-it-works.
# Mirrors the security page's trust section (same StepsCaption component); the
# deeper mechanism still lives on /security, linked from exploreSecurity below.
trust:
  heading: Build on trust, extend it forward
  steps:
    - n: START
      heading: From a trusted base
      body: Begin with a base image whose integrity you already vouch for — a shared root others build from.
    - n: EXTEND
      heading: Add your own layers
      body: Stack your changes on top. Each layer is a read-only, integrity-protected image bound into the chain below it.
    - n: VERIFY
      heading: One anchor checks it all
      body: A single trusted root validates the entire stack. Tamper with any layer and the check fails — no trust is lost as you extend.

# One-button row linking to the security page. The trust/layers mechanism and
# the audience columns live there now, so the landing page stays a tight pitch.
exploreSecurity:
  - label: How the trust model works →
    href: /security
    style: ghost

comparison:
  heading: "Containers vs. VMs: pick your compromise"
  # Each column header is the option's card: a colored dot, its name, and a
  # one-line verdict. dot: gray | gold | green. `win: true` tints the column.
  columns:
    - key: containers
      name: Containers
      dot: gray
      verdict: Fast and portable, but every container shares the host kernel.
    - key: vms
      name: Traditional VMs
      dot: gold
      verdict: Strong isolation, but heavy, booting through large UEFI firmware.
    - key: pichi
      name: pichi
      dot: green
      win: true
      verdict: Container workflow, true VM isolation, tiny measured boot chain.
  rows:
    # `good` lists the column keys whose cell is the strong choice on that row —
    # those cells get a green background so wins are scannable at a glance.
    - label: Isolation
      good: [vms, pichi]
      containers: Shared host kernel
      vms: Full VM boundary
      pichi: Full VM boundary
    - label: Workflow
      good: [containers, pichi]
      containers: pull / push / run over OCI
      vms: Bespoke tooling
      pichi: pull / push / run over OCI
    - label: Distribution
      good: [containers, pichi]
      containers: Incremental — pull only what changed
      vms: Ship the whole disk image
      pichi: Incremental — pull only what changed
    - label: Portability
      good: [containers, pichi]
      containers: One image, many hosts
      vms: Tied to hypervisor & format
      pichi: One image for laptop, cloud, bare metal
    - label: Boot time
      good: [containers, pichi]
      containers: Milliseconds — no boot
      vms: Seconds — full firmware + OS
      pichi: Milliseconds — tiny boot chain

footer:
  meta:

# ─────────────────────────────────────────────────────────────────────────────
# Landing page content. Edit the words here — the components render from this.
#
#   • This file holds every REPEATED item: cards, props, steps, table rows,
#     list items, CTA buttons, terminal lines. Edit their text freely.
#   • Standalone paragraphs (section intros, captions) live in prose.yaml,
#     rendered as-is with set:html (use inline HTML like <br> for a break).
# ─────────────────────────────────────────────────────────────────────────────

# Call-to-action buttons, reused in the hero and footer.
# style: "primary" (filled) or "ghost" (outline).
ctas:
  - label: View the source
    href: https://github.com/pichi-vm
    style: primary
  - label: Try It
    href: "#try-it"
    style: ghost

hero:
  logoAlt: pichi-vm mascot — a curled-up armadillo line drawing
  eyebrow: pichi-vm
  # <br> marks the line break in the headline.
  title: The container workflow,<br>for real virtual machines.
  # Compact command preview — the product, above the fold. The annotated
  # walkthrough (with output) lives in the "How it works" terminal below.
  commands:
    - pichi pull ghcr.io/acme/postgres-vm:16
    - pichi run postgres-vm:16
  # Stat strip under the CTAs. Design targets, not measured results — kept
  # honest to match the "early / experimental" badge.
  stats:
    - { value: ~15 ms, label: boot target }
    - { value: <5 MiB, label: memory overhead }
    - { value: 3 hosts, label: one image }

why:
  title: Why Pichi
  # Props are grouped into thematic bands; each renders as an eyebrow-labelled
  # 3-up row. Keep three cards per group so every row fills cleanly.
  groups:
    - label: Lightweight & fast
      props:
        - heading: Fast startup
          body: A pichi VM boots through a tiny measured chain, not large UEFI firmware — designed to have the guest running in tens of milliseconds, not seconds.
        - heading: Low memory overhead
          body: No fat firmware, no emulated legacy hardware — the VM is built to add a few megabytes over the guest, not hundreds.
        - heading: Run anywhere
          body: One image runs on Linux, macOS, and Windows hosts.
    - label: The workflow you know
      props:
        - heading: Container-like workflow
          body: Pull, push, run, and cache over any OCI registry — the workflow you already know.
        - heading: Incremental social distribution
          body: A pichi image is built in layers, like a Docker image. Push or pull only the layers that changed — and build on anyone else's image, sharing common bases the way containers taught you to.
        - heading: Immutable images
          body: Every image is read-only and content-addressed. You don't patch a running VM — you rebuild and redeploy, so what you tested is exactly what runs. No drift, clean rollback.
    - label: Real isolation & trust
      props:
        - heading: Real isolation
          body: Your own kernel and your own memory, not a slice of the host's — a true VM boundary, not a shared-kernel namespace.
        - heading: Explicit hardware, by contract
          body: PMI makes the guest's hardware explicit — you declare the devices and resources you run on. Host and guest negotiate a resource contract at launch, no admin privilege required.
        - heading: Confidential computing
          body: The small, measurable trusted base is built for attestation — a path to running images confidentially on hardware you can prove, not just trust.

howItWorks:
  heading: How it works
  # The three steps map one-to-one onto the terminal commands beside them:
  # Install → apt install, Pull → pichi pull, Run → pichi run.
  steps:
    - n: 01 · INSTALL
      heading: " "
      body: Grab the pichi binary. One tool with no host reconfiguration.
    - n: 02 · PULL
      heading: " "
      body: Pull a pichi image from any OCI registry.
    - n: 03 · RUN
      heading: " "
      body: Boot it anywhere as a real VM, designed for a boot measured in milliseconds.

  # The live walkthrough shown beside the steps. Each line: kind "cmd" (a $
  # prompt + command), "out" (output), or "gap" (blank line). Quote the text so
  # commas aren't read as YAML separators.
  terminal:
    - { kind: cmd, text: "apt install pichi" }
    - { kind: out, text: "Installing: pichi  (provisional — 0.x)" }
    - { kind: gap }
    - { kind: cmd, text: "pichi pull ghcr.io/acme/postgres-vm:16" }
    - { kind: out, text: "Fetched postgres-vm:16 — 3 of 5 layers reused" }
    - { kind: gap }
    - { kind: cmd, text: "pichi run postgres-vm:16" }
    - { kind: out, text: "Booting VM… boot chain measured, handing off." }
    - { kind: out, text: "guest ready — own kernel, own memory" }

# One-button row linking to the security page. The trust/layers mechanism and
# the audience columns live there now, so the landing page stays a tight pitch.
exploreSecurity:
  - label: How the trust model works →
    href: /security
    style: ghost

comparison:
  heading: "Containers vs. VMs: pick your compromise"
  # Each column header is the option's card: a colored dot, its name, and a
  # one-line verdict. dot: gray | gold | green. `win: true` tints the column.
  columns:
    - key: containers
      name: Containers
      dot: gray
      verdict: Fast and portable, but every container shares the host kernel.
    - key: vms
      name: Traditional VMs
      dot: gold
      verdict: Strong isolation, but heavy, booting through large UEFI firmware.
    - key: pichi
      name: pichi
      dot: green
      win: true
      verdict: Container workflow, true VM isolation, tiny measured boot chain.
  rows:
    # `good` lists the column keys whose cell is the strong choice on that row —
    # those cells get a green background so wins are scannable at a glance.
    - label: Isolation
      good: [vms, pichi]
      containers: Shared host kernel
      vms: Full VM boundary
      pichi: Full VM boundary
    - label: Workflow
      good: [containers, pichi]
      containers: pull / push / run over OCI
      vms: Bespoke tooling
      pichi: pull / push / run over OCI
    - label: Distribution
      good: [containers, pichi]
      containers: Incremental — pull only what changed
      vms: Ship the whole disk image
      pichi: Incremental — pull only what changed
    - label: Portability
      good: [containers, pichi]
      containers: One image, many hosts
      vms: Tied to hypervisor & format
      pichi: One image for laptop, cloud, bare metal
    - label: Boot time
      good: [containers, pichi]
      containers: Milliseconds — no boot
      vms: Seconds — full firmware + OS
      pichi: Milliseconds — tiny boot chain

footer:
  meta:
    - { label: GitHub, href: https://github.com/pichi-vm }
    - { label: Security & trust, href: /security }

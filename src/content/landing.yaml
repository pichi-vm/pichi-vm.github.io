# ─────────────────────────────────────────────────────────────────────────────
# Landing page content. Edit the words here — the components render from this.
#
#   • This file holds every REPEATED item: cards, props, steps, table rows,
#     list items, CTA buttons, terminal lines. Edit their text freely.
#   • Standalone paragraphs (section intros, captions) live in prose.yaml,
#     rendered as-is with set:html (use inline HTML like <br> for a break).
# ─────────────────────────────────────────────────────────────────────────────

# Call-to-action buttons, reused in the hero and footer.
# style: "primary" (filled) or "ghost" (outline).
ctas:
  - label: Explore the docs
    href: docs.html
    style: primary
  - label: Try It
    href: "#try-it"
    style: ghost

hero:
  logoAlt: pichi-vm mascot — a curled-up armadillo line drawing
  eyebrow: pichi-vm
  # <br> marks the line break in the headline.
  title: The container workflow,<br>for real virtual machines.

why:
  title: Why pichi
  props:
    - heading: Run anywhere
      body: One image runs on Linux, macOS, and Windows hosts, and on bare metal — no rebuild.
    - heading: Real isolation
      body: Your own kernel and memory, not a slice of the host's.
    - heading: Container-like workflow
      body: Pull, push, run, and cache over any OCI registry — the workflow you already know.
    - heading: Incremental distribution
      body: A pichi image is built in layers, like a Docker image. Push or pull only the layers that changed, so small updates stay small and shared bases are fetched once.

howItWorks:
  heading: How it works
  # The three steps map one-to-one onto the terminal commands beside them:
  # Install → apt install, Pull → pichi pull, Run → pichi run.
  steps:
    - n: 01 · INSTALL
      heading: Install
      body: Grab the pichi binary. One tool, no daemon and no host reconfiguration.
    - n: 02 · PULL
      heading: Pull
      body: Pull a pichi image from any OCI registry — the same place your container images already live.
    - n: 03 · RUN
      heading: Run
      body: Boot it anywhere — laptop, cloud, or bare metal — as a real VM, not a shared-kernel container.
  # The live walkthrough shown beside the steps. Each line: kind "cmd" (a $
  # prompt + command), "out" (output), or "gap" (blank line). Quote the text so
  # commas aren't read as YAML separators.
  terminal:
    - { kind: cmd, text: "apt install pichi" }
    - { kind: out, text: "Installing: pichi" }
    - { kind: gap }
    - { kind: cmd, text: "pichi pull ghcr.io/acme/app:1.0" }
    - { kind: out, text: "Fetched app:1.0 (pichi image)" }
    - { kind: gap }
    - { kind: cmd, text: "pichi run app:1.0" }
    - { kind: out, text: "Booting VM… kernel measured, handing off." }

# One-button row linking to the security page. The trust/layers mechanism and
# the audience columns live there now, so the landing page stays a tight pitch.
exploreSecurity:
  - label: How the trust model works →
    href: /security
    style: ghost

comparison:
  heading: "Containers vs. VMs: pick your compromise"
  # Each column header is the option's card: a colored dot, its name, and a
  # one-line verdict. dot: gray | gold | green. `win: true` tints the column.
  columns:
    - key: containers
      name: Containers
      dot: gray
      verdict: Fast and portable, but every container shares the host kernel.
    - key: vms
      name: Traditional VMs
      dot: gold
      verdict: Strong isolation, but heavy, booting through large UEFI firmware.
    - key: pichi
      name: pichi
      dot: green
      win: true
      verdict: Container workflow, true VM isolation, tiny measured boot chain.
  rows:
    # `good` lists the column keys whose cell is the strong choice on that row —
    # those cells get a green background so wins are scannable at a glance.
    - label: Isolation
      good: [vms, pichi]
      containers: Shared host kernel
      vms: Full VM boundary
      pichi: Full VM boundary
    - label: Workflow
      good: [containers, pichi]
      containers: pull / push / run over OCI
      vms: Bespoke tooling
      pichi: pull / push / run over OCI
    - label: Distribution
      good: [containers, pichi]
      containers: Incremental — pull only what changed
      vms: Ship the whole disk image
      pichi: Incremental — pull only what changed
    - label: Portability
      good: [containers, pichi]
      containers: One image, many hosts
      vms: Tied to hypervisor & format
      pichi: One image for laptop, cloud, bare metal
    - label: Boot time
      good: [containers, pichi]
      containers: Milliseconds — no boot
      vms: Seconds — full firmware + OS
      pichi: Milliseconds — tiny boot chain

footer:
  meta:
    - { label: GitHub, href: https://github.com/pichi-vm }
    - { label: Security & trust, href: /security }
    - { label: Docs & demos, href: docs.html }
  license: Apache-2.0 licensed
  badge: open source · early / experimental

hero:
  eyebrow: Virtual machines, packaged differently
  title: Container workflow.
  accent: VM isolation.
  logoAlt: Pichi, an armadillo with a flower in its headband
  primary: { label: Watch it work, href: "#demo" }
  secondary:
    { label: Explore the source, href: "https://github.com/pichi-vm/pichi" }

demo:
  eyebrow: 01 / See it in practice
  title: From recipe to running workload.
  src: /recordings/codex.cast
  downloadLabel: Download recording
  cols: 128
  rows: 34
  duration: "5:12"
  terminalLabel: pichi · Ubuntu + Codex
  fallback: Enable JavaScript to play the demo, or download the recording below.
  markers:
    - [0, Recipe and lock]
    - [71, Build]
    - [162, Inspect]
    - [236, Run Codex]
    - [285, Shutdown]

image:
  eyebrow: 02 / Inside the image
  title: More than a filesystem.
  label: One OCI image
  parts:
    - name: Carapace
      detail: Read-only filesystem
      body: A stack of scutes combines a base image and your changes into one integrity-protected block device.
      tone: blue
    - name: PMI
      detail: Boot payload
      body: The kernel and initramfs travel with the image, so the guest brings its own boot environment.
      tone: purple
    - name: Bootconfig
      detail: Boot settings
      body: Kernel and early userspace settings accompany the payload.
      tone: orange
    - name: Requirements
      detail: Launch configuration
      body: The image declares CPU, memory, storage, and interface requirements for the launcher.
      tone: green
  link:
    {
      label: Read the image model,
      href: "https://github.com/pichi-vm/pichi#the-artifact-model",
    }

status:
  eyebrow: 03 / Where we are
  title: Built in the open.
  current:
    label: Implemented
    title: Inspectable images. Verified blocks.
    items:
      - Build from a committed recipe and locked base images.
      - Inspect source-commit annotations and image digests.
      - Validate read-only image blocks through dm-verity.
  planned:
    label: Planned
    title: Attestation and confidential computing.
    body: Runtime attestation and confidential-computing support are the next part of the design. They are not implemented yet.
    link: { label: Follow development, href: "https://github.com/pichi-vm" }

